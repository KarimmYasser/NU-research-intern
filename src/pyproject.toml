[project]
name = "sesc-2026-02-agentic-cfd"
version = "0.0.1"
description = "Agentic AI workflow for OpenFOAM CFD case generation using local LLMs (SESC-2026-02)"
requires-python = ">=3.11"
dependencies = [
    # OpenAI-compatible client works against Ollama's /v1 endpoint (and vLLM's, and
    # SGLang's) without a rewrite if the backend choice changes later.
    "openai>=1.0",
    "pydantic>=2.0",
    # Orchestration framework (decided: LangGraph - see docs/mentor-decisions,
    # docs/agent-framework-comparison.md §7). agents/graph.py is the StateGraph.
    "langgraph>=0.2",
    # Loads .env (LOCAL_LLM_BASE_URL / LOCAL_LLM_MODEL / LLM_GATEWAY_API_KEY).
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Alternatives considered and not chosen (docs/agent-framework-comparison.md).
autogen = ["pyautogen>=0.2"]
crewai = ["crewai>=0.30"]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
